<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edede9" />
    <meta
      name="description"
      content="Yuyito: un pomodoro de 25 minutos que hace crecer un bosque."
    />
    <title>Yuyito</title>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('yuyito')
          const parsed = raw ? JSON.parse(raw) : null
          const mode = parsed?.state?.display?.themeMode
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = mode === 'night' || (mode === 'system' && systemDark) ? 'night' : 'day'
          document.documentElement.dataset.theme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'night' ? '#141c24' : '#edede9')
        } catch {
          document.documentElement.dataset.theme = 'day'
        }
      })()
    </script>
    <link rel="preload" as="image" href="/sprites/tileset8x8.png?v=4" />
    <link rel="preload" as="image" href="/sprites/pino_atlas.png" />
    <link rel="preload" as="image" href="/sprites/pino_muerto_atlas.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
